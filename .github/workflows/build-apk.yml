name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Sonora APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK and licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SDK_DIR/licenses" || true
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" >> "$SDK_DIR/licenses/android-sdk-license" || true

      - name: Prepare debug keystore
        run: |
          if [ -n "${{ secrets.SONORA_KEYSTORE_BASE64 }}" ]; then
            echo "Usando keystore desde secreto SONORA_KEYSTORE_BASE64"
            printf '%s' "${{ secrets.SONORA_KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > debug.keystore
            if [ ! -s debug.keystore ]; then
              echo "ERROR: El secreto SONORA_KEYSTORE_BASE64 está vacío o corrupto."
              exit 1
            fi
          elif [ -f debug.keystore.base64 ]; then
            echo "Usando keystore fijo desde debug.keystore.base64"
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
            if [ ! -s debug.keystore ]; then
              echo "ERROR: debug.keystore.base64 está vacío o corrupto."
              exit 1
            fi
          elif [ ! -f debug.keystore ]; then
            echo "ERROR: No se encontró debug.keystore.base64 ni secreto SONORA_KEYSTORE_BASE64."
            exit 1
          fi
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        run: |
          EPOCH_MINUTES=$(( ( $(date -u +%s) - 1767225600 ) / 60 ))
          RUN_FLOOR=$(( 1000000 + GITHUB_RUN_NUMBER * 10 ))
          if [ "$EPOCH_MINUTES" -gt "$RUN_FLOOR" ]; then
            VERSION_CODE=$(( EPOCH_MINUTES + GITHUB_RUN_NUMBER ))
          else
            VERSION_CODE="$RUN_FLOOR"
          fi
          VERSION_NAME="2.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "Compilando APK con versionCode=${VERSION_CODE}, versionName=${VERSION_NAME}"
          gradle :app:assembleDebug \
            -PappVersionCode="${VERSION_CODE}" \
            -PappVersionName="${VERSION_NAME}" \
            --no-parallel --no-configuration-cache -Pkotlin.compiler.execution.strategy=daemon --stacktrace

      - name: Verify APK versionCode and signature
        run: |
          APK_SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "ERROR: No se encontró el APK generado."
            exit 1
          fi
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT2=$(find "$SDK_DIR/build-tools" -name aapt2 -type f 2>/dev/null | sort -V | tail -n 1)
          APKSIGNER=$(find "$SDK_DIR/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$AAPT2" ]; then
            BADGING=$("$AAPT2" dump badging "$APK_SRC" | head -n 3)
            echo "$BADGING"
            if ! echo "$BADGING" | grep -q "versionCode='${VERSION_CODE}'"; then
              echo "ERROR: El APK no quedó compilado con versionCode=${VERSION_CODE}."
              exit 1
            fi
          fi
          if [ -n "$APKSIGNER" ]; then
            CERT_INFO=$("$APKSIGNER" verify --print-certs "$APK_SRC")
            echo "$CERT_INFO"
            CERT_SHA1=$(echo "$CERT_INFO" | grep -m1 "SHA-1 digest:" | awk '{print $NF}')
            echo "CERT_SHA1=${CERT_SHA1}" >> "$GITHUB_ENV"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonora-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --no-parallel --no-configuration-cache -Pkotlin.compiler.execution.strategy=daemon --stacktrace

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "No se encontró el APK generado"
            exit 1
          fi
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v2.0.${{ github.run_number }}"
          fi
          APK_OUT="Sonora-${TAG}.apk"
          cp "$APK_SRC" "$APK_OUT"
          NOTES="APK de Sonora (${VERSION_NAME}, versionCode ${VERSION_CODE}${CERT_SHA1:+, SHA-1 ${CERT_SHA1}}) generado desde \`${{ github.ref_name }}\`."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_OUT" --clobber
            gh release edit "$TAG" --notes "$NOTES" || true
          else
            gh release create "$TAG" "$APK_OUT" \
              --target "${{ github.sha }}" \
              --title "Sonora ${TAG}" \
              --notes "$NOTES"
          fi
